<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>논술고사 감독위원 신청 및 일정 조사</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-3 text-gray-800">

  <div class="w-full max-w-md bg-white rounded-2xl shadow-xl p-6 sm:p-8">
    <!-- 헤더 -->
    <div class="text-center mb-6">
      <span class="bg-blue-100 text-blue-700 text-xs font-semibold px-2.5 py-1 rounded-full">공식 인증 신청서</span>
      <h1 class="text-xl font-bold mt-2">논술고사 감독위원 신청</h1>
      <p class="text-xs text-gray-500 mt-1">발급받은 7자리 코드로 인증된 분만 참여 가능합니다.</p>
    </div>

    <!-- 1단계: 7자리 코드 인증 (0000-000 자동 하이픈) -->
    <div id="step-auth" class="space-y-4">
      <div>
        <label class="block text-xs font-semibold text-gray-600 mb-1">발급받은 입장코드 (7자리 숫자)</label>
        <div class="flex gap-2">
          <input type="tel" id="input-code" inputmode="numeric" maxlength="8" placeholder="0000-000"
                 class="w-full font-mono text-center text-xl font-bold tracking-widest px-4 py-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-blue-500 focus:outline-none">
          <button type="button" id="btn-verify" onclick="verifyCode()" class="bg-blue-600 text-white font-medium px-5 py-3 rounded-xl hover:bg-blue-700 whitespace-nowrap">
            인증확인
          </button>
        </div>
        <p id="auth-msg" class="text-xs text-red-500 mt-2 hidden"></p>
      </div>
    </div>

    <!-- 2단계: 설문 폼 -->
    <form id="survey-form" class="space-y-6 hidden" onsubmit="submitSurvey(event)">
      <div class="bg-blue-50 border border-blue-200 rounded-xl p-3 text-xs text-blue-800">
        코드 인증 완료: <span id="display-assigned-name" class="font-bold"></span> 님 대상 배정 코드
      </div>

      <!-- 성함 / 연락처 (자동 기입되며 수정 가능) -->
      <div class="space-y-3">
        <div>
          <label class="block text-xs font-semibold text-gray-700 mb-1">성명 <span class="text-red-500">*</span></label>
          <input type="text" id="user-name" required placeholder="홍길동"
                 class="w-full px-4 py-2.5 border border-gray-300 rounded-xl focus:ring-2 focus:ring-blue-500 focus:outline-none text-sm">
        </div>
        <div>
          <label class="block text-xs font-semibold text-gray-700 mb-1">휴대폰 번호 <span class="text-red-500">*</span></label>
          <input type="tel" id="user-phone" required placeholder="010-0000-0000" inputmode="numeric"
                 class="w-full px-4 py-2.5 border border-gray-300 rounded-xl focus:ring-2 focus:ring-blue-500 focus:outline-none text-sm font-mono">
        </div>
      </div>

      <!-- 논술고사 참여 의사 -->
      <div>
        <label class="block text-xs font-semibold text-gray-700 mb-1">논술고사 참여 의사 <span class="text-red-500">*</span></label>
        <p class="text-xs text-blue-600 font-medium mb-2">※ 올해 논술고사는 2026년 11월 22일(일)입니다.</p>
        <div class="grid grid-cols-2 gap-2">
          <label class="flex items-center justify-center p-3 border rounded-xl cursor-pointer hover:bg-gray-50 has-[:checked]:border-blue-600 has-[:checked]:bg-blue-50">
            <input type="radio" name="participate" value="참여 가능" required onchange="toggleParticipation(true)" class="mr-2">
            <span class="text-sm font-medium">참여 가능</span>
          </label>
          <label class="flex items-center justify-center p-3 border rounded-xl cursor-pointer hover:bg-gray-50 has-[:checked]:border-blue-600 has-[:checked]:bg-blue-50">
            <input type="radio" name="participate" value="참여 불가" required onchange="toggleParticipation(false)" class="mr-2">
            <span class="text-sm font-medium">참여 불가</span>
          </label>
        </div>
      </div>

      <!-- 참여 가능자 전용 상세 영역 -->
      <div id="section-available-details" class="space-y-6 hidden">

        <!-- 희망 시간대 순위 선택 (고유 ID 기반 단일 배열 - 중복 원천 차단) -->
        <div>
          <div class="flex justify-between items-center mb-1">
            <label class="block text-xs font-semibold text-gray-700">선호 근무 시간대 (1순위 필수 선택) <span class="text-red-500">*</span></label>
            <button type="button" onclick="resetTimeRanking()" class="text-xs text-blue-600 hover:underline">선택 초기화</button>
          </div>
          <p class="text-[11px] text-gray-500 mb-2">
            ※ 누르는 순서대로 1~4순위가 매겨집니다. 최소 1개(1순위)만 선택하셔도 제출 가능합니다.<br>
            ※ 배정되는 역할에 따라 정확한 출근시간은 달라질 수 있으며 고사 전일 개별 통보됩니다.
          </p>

          <div class="space-y-2">
            <button type="button" data-time-id="1" onclick="toggleTimeOption(1)"
                    class="time-option-btn w-full text-left p-3 border border-gray-200 rounded-xl hover:border-blue-400 flex items-center justify-between text-xs transition">
              <span class="text-gray-700">1) 3타임 가능(대부분) : 오전 7시 반경 ~ 오후 7시 종료 예정</span>
              <span class="badge text-xs font-bold text-blue-600 bg-blue-100 px-2 py-0.5 rounded-full hidden"></span>
            </button>
            <button type="button" data-time-id="2" onclick="toggleTimeOption(2)"
                    class="time-option-btn w-full text-left p-3 border border-gray-200 rounded-xl hover:border-blue-400 flex items-center justify-between text-xs transition">
              <span class="text-gray-700">2) 2타임(소수) : 오전 7시 반경 ~ 오후 3시경 종료 예정</span>
              <span class="badge text-xs font-bold text-blue-600 bg-blue-100 px-2 py-0.5 rounded-full hidden"></span>
            </button>
            <button type="button" data-time-id="3" onclick="toggleTimeOption(3)"
                    class="time-option-btn w-full text-left p-3 border border-gray-200 rounded-xl hover:border-blue-400 flex items-center justify-between text-xs transition">
              <span class="text-gray-700">3) 2타임(소수) : 오전 10시 반경 ~ 오후 7시 종료 예정</span>
              <span class="badge text-xs font-bold text-blue-600 bg-blue-100 px-2 py-0.5 rounded-full hidden"></span>
            </button>
            <button type="button" data-time-id="4" onclick="toggleTimeOption(4)"
                    class="time-option-btn w-full text-left p-3 border border-gray-200 rounded-xl hover:border-blue-400 flex items-center justify-between text-xs transition">
              <span class="text-gray-700">4) 1타임(소수) : 오전 10시 반경 ~ 오후 3시경 종료 예정</span>
              <span class="badge text-xs font-bold text-blue-600 bg-blue-100 px-2 py-0.5 rounded-full hidden"></span>
            </button>
          </div>
        </div>

        <!-- 소속 선택 -->
        <div>
          <label class="block text-xs font-semibold text-gray-700 mb-1">소속을 선택하여 주십시오 <span class="text-red-500">*</span></label>
          <select id="affiliation" onchange="toggleAffiliationInfo(this.value)"
                  class="w-full px-4 py-2.5 border border-gray-300 rounded-xl focus:ring-2 focus:ring-blue-500 focus:outline-none text-xs bg-white">
            <option value="">-- 소속 선택 --</option>
            <option value="동국대학교">동국대학교</option>
            <option value="법인">법인</option>
            <option value="의료원">의료원</option>
            <option value="산단">산단</option>
            <option value="기타">기타</option>
          </select>
        </div>

        <!-- 계좌 및 주소 입력 (동국대학교 외 선택 시 노출) -->
        <div id="extra-info-box" class="space-y-3 p-4 bg-gray-50 border border-gray-200 rounded-xl hidden">
          <p class="text-xs text-amber-800 font-semibold">수당 지급을 위한 추가 정보 입력이 필요합니다.</p>
          <div>
            <label class="block text-xs font-semibold text-gray-700 mb-1">은행명 <span class="text-red-500">*</span></label>
            <input type="text" id="bank-name" placeholder="예: 신한은행"
                   class="w-full px-3 py-2 border rounded-lg text-xs focus:ring-2 focus:ring-blue-500 focus:outline-none bg-white">
          </div>
          <div>
            <label class="block text-xs font-semibold text-gray-700 mb-1">계좌번호 <span class="text-red-500">*</span></label>
            <input type="text" id="account-number" placeholder="'-' 없이 숫자만 입력"
                   class="w-full px-3 py-2 border rounded-lg text-xs focus:ring-2 focus:ring-blue-500 focus:outline-none bg-white">
          </div>
          <div>
            <label class="block text-xs font-semibold text-gray-700 mb-1">주소 <span class="text-red-500">*</span></label>
            <input type="text" id="address" placeholder="기본주소 및 상세주소 입력"
                   class="w-full px-3 py-2 border rounded-lg text-xs focus:ring-2 focus:ring-blue-500 focus:outline-none bg-white">
          </div>
        </div>

        <!-- 사전교육 희망일자 (전원 필수) -->
        <div>
          <label class="block text-xs font-semibold text-gray-700 mb-1">사전교육 희망일자 (전원 필수 선택) <span class="text-red-500">*</span></label>
          <div class="space-y-2">
            <label class="flex items-start p-3 border rounded-xl cursor-pointer hover:bg-gray-50 has-[:checked]:border-blue-600 has-[:checked]:bg-blue-50">
              <input type="radio" name="training_date" value="1차(경험자 중심) : 2026년 11월 19일(목) 15:00 혜화관 3층 함명희 미래융합세미나실" class="mt-0.5 mr-2">
              <span class="text-xs">
                <strong class="text-blue-900">1차 (경험자 중심)</strong><br>
                2026년 11월 19일(목) 15:00<br>
                혜화관 3층 함명희 미래융합세미나실
              </span>
            </label>
            <label class="flex items-start p-3 border rounded-xl cursor-pointer hover:bg-gray-50 has-[:checked]:border-blue-600 has-[:checked]:bg-blue-50">
              <input type="radio" name="training_date" value="2차(초보자 중심) : 2026년 11월 20일(금) 10:30 혜화관 2층 고순청세미나실" class="mt-0.5 mr-2">
              <span class="text-xs">
                <strong class="text-blue-900">2차 (초보자 중심)</strong><br>
                2026년 11월 20일(금) 10:30<br>
                혜화관 2층 고순청세미나실
              </span>
            </label>
          </div>
        </div>

      </div>

      <!-- 개인정보 수집 및 이용 동의 -->
      <div class="pt-2">
        <label class="flex items-start">
          <input type="checkbox" id="privacy-agree" required class="w-4 h-4 mt-0.5 text-blue-600 rounded">
          <span class="text-xs text-gray-600 ml-2 leading-relaxed">
            [필수] 논술고사 감독위원 선발, 일정 조율 및 수당 지급을 위한 개인정보(성명, 연락처, 계좌 등) 수집 및 이용에 동의합니다.
          </span>
        </label>
      </div>

      <button type="submit" id="btn-submit" class="w-full bg-blue-600 text-white font-bold py-3.5 rounded-xl hover:bg-blue-700 shadow-md transition">
        제출하기
      </button>
    </form>

    <!-- 완료 메시지 -->
    <div id="step-complete" class="text-center py-8 hidden space-y-3">
      <div class="w-12 h-12 bg-green-100 text-green-600 rounded-full flex items-center justify-center mx-auto text-2xl font-bold">✓</div>
      <h3 class="text-lg font-bold">제출이 완료되었습니다</h3>
      <p class="text-xs text-gray-500">논술고사 감독위원 배정 결과 및 세부 안내는 별도 문자로 발송됩니다.</p>
    </div>
  </div>

  <script>
    // ⚠️ [필수] 본인의 실제 구글 배포 URL(/exec)을 입력하세요.
    const API_URL = "https://script.google.com/macros/s/AKfycbwa6TMknpvnZH5UeE067_Icq6qRu-O0pqG8tsGPo3EhlxbOTFcILN54AAh_uoD0nDch/exec";
    const PUBLIC_ENCRYPTION_SECRET = "EXAM_PROCTOR_AES_SECURE_KEY_2026";

// 전화번호 자동 포맷팅 (앞자리 0 탈락 자동 복구 포함)
    function formatPhoneNumber(num) {
      if (!num) return "";
      let clean = String(num).replace(/[^0-9]/g, "");
      
      // 구글 시트가 앞자리 0을 지운 10자리(10XXXXXXXX)인 경우 0 추가
      if (clean.length === 10 && clean.startsWith("10")) {
        clean = "0" + clean;
      }

      if (clean.length === 11) {
        return clean.replace(/(\d{3})(\d{4})(\d{4})/, "$1-$2-$3");
      } else if (clean.length === 10) {
        if (clean.startsWith("02")) {
          return clean.replace(/(\d{2})(\d{4})(\d{4})/, "$1-$2-$3");
        }
        return clean.replace(/(\d{3})(\d{3})(\d{4})/, "$1-$2-$3");
      } else if (clean.length === 12) {
        return clean.replace(/(\d{4})(\d{4})(\d{4})/, "$1-$2-$3");
      }
      return clean;
    }

    // 코드 검증 및 자동 기입
    async function verifyCode() {
      const codeInput = document.getElementById("input-code");
      const authBtn = document.getElementById("btn-verify");
      const authMsg = document.getElementById("auth-msg");
      const code = codeInput.value.trim();

      authMsg.classList.add("hidden");

      if (code.replace(/[^0-9]/g, "").length !== 7) {
        authMsg.textContent = "7자리 숫자를 올바르게 입력해주세요.";
        authMsg.classList.remove("hidden");
        return;
      }

      authBtn.disabled = true;
      authBtn.textContent = "인증 중...";

      try {
        const res = await fetch(`${API_URL}?action=verify&code=${encodeURIComponent(code)}`);
        const data = await res.json();

        if (data.success) {
          if (data.alreadySubmitted) {
            const reconfirm = confirm("입력된 정보가 있습니다. 새로 작성하시겠습니까?");
            if (!reconfirm) {
              authBtn.disabled = false;
              authBtn.textContent = "인증확인";
              return;
            }
          }

          document.getElementById("step-auth").classList.add("hidden");
          document.getElementById("survey-form").classList.remove("hidden");
          document.getElementById("display-assigned-name").textContent = data.assignedTo || "지정인";

          // 성명 및 전화번호 자동 기입 (백엔드 변수명 호환 처리)
          const targetPhone = data.assignedPhone || data.assigned_phone || data.phone || "";
          document.getElementById("user-name").value = data.assignedTo || "";
          document.getElementById("user-phone").value = formatPhoneNumber(targetPhone);
        } else {
          authMsg.textContent = data.message || "유효하지 않은 코드입니다.";
          authMsg.classList.remove("hidden");
        }
      } catch (err) {
        authMsg.textContent = "서버 연결 실패: " + err.message;
        authMsg.classList.remove("hidden");
      } finally {
        authBtn.disabled = false;
        authBtn.textContent = "인증확인";
      }
    }

    function toggleParticipation(isAvailable) {
      const details = document.getElementById("section-available-details");
      if (isAvailable) {
        details.classList.remove("hidden");
      } else {
        details.classList.add("hidden");
      }
    }

    // 4. 시간대 순위 관리 (고유 ID 기반 - 중복 순위 원천 차단)
    function toggleTimeOption(id) {
      const index = rankedTimeIds.indexOf(id);
      if (index > -1) {
        rankedTimeIds.splice(index, 1); // 재클릭 시 선택 취소
      } else {
        rankedTimeIds.push(id); // 클릭 순서대로 누적
      }
      refreshTimeBadges();
    }

    function refreshTimeBadges() {
      const buttons = document.querySelectorAll(".time-option-btn");
      buttons.forEach(btn => {
        const btnId = parseInt(btn.getAttribute("data-time-id"), 10);
        const rankIndex = rankedTimeIds.indexOf(btnId);
        const badge = btn.querySelector(".badge");

        if (rankIndex > -1) {
          btn.classList.add("border-blue-600", "bg-blue-50");
          badge.textContent = `${rankIndex + 1}순위`; // 1, 2, 3, 4 순서대로만 부여됨
          badge.classList.remove("hidden");
        } else {
          btn.classList.remove("border-blue-600", "bg-blue-50");
          badge.classList.add("hidden");
        }
      });
    }

    function resetTimeRanking() {
      rankedTimeIds = [];
      refreshTimeBadges();
    }

    function toggleAffiliationInfo(value) {
      const box = document.getElementById("extra-info-box");
      if (value && value !== "동국대학교") {
        box.classList.remove("hidden");
      } else {
        box.classList.add("hidden");
      }
    }

    // 5. 설문 최종 제출 (1순위 필수 조건 검사)
    async function submitSurvey(e) {
      e.preventDefault();
      const submitBtn = document.getElementById("btn-submit");
      const code = document.getElementById("input-code").value.trim();
      const name = document.getElementById("user-name").value.trim();
      const phone = formatPhoneNumber(document.getElementById("user-phone").value.trim());
      const participate = document.querySelector('input[name="participate"]:checked').value;

      let timeResult = "";
      let affiliation = "";
      let bankName = "";
      let accountNumber = "";
      let address = "";
      let trainingDate = "";

      if (participate === "참여 가능") {
        // [조건 5] 1순위(최소 1개) 필수 선택 검사
        if (rankedTimeIds.length === 0) {
          alert("선호 근무 시간대를 최소 1개 이상(1순위) 반드시 선택해주세요.");
          return;
        }

        // 3타임(ID: 1)이 1순위(배열 0번째)에 없는 경우 경고문구 안내
        if (rankedTimeIds[0] !== 1) {
          alert("3타임을 선택하지 않는 분은, 상황에 따라 감독위원에 배정되지 못할 수 있습니다.");
        }

        // 2~4순위는 선택하지 않아도 선택된 항목까지만 순서대로 저장됨
        timeResult = rankedTimeIds.map((id, idx) => `${idx + 1}순위: ${TIME_OPTIONS[id]}`).join(" | ");

        // 소속 선택 검증
        affiliation = document.getElementById("affiliation").value;
        if (!affiliation) {
          alert("소속을 선택해주세요.");
          document.getElementById("affiliation").focus();
          return;
        }

        if (affiliation !== "동국대학교") {
          bankName = document.getElementById("bank-name").value.trim();
          accountNumber = document.getElementById("account-number").value.trim();
          address = document.getElementById("address").value.trim();

          if (!bankName || !accountNumber || !address) {
            alert("동국대학교 외 소속인 경우 은행명, 계좌번호, 주소를 모두 입력하셔야 합니다.");
            return;
          }
        }

        // 사전교육 희망일자 검증
        const selectedTraining = document.querySelector('input[name="training_date"]:checked');
        if (!selectedTraining) {
          alert("사전교육 희망일자를 반드시 선택해주세요.");
          return;
        }
        trainingDate = selectedTraining.value;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = "제출 중...";

      // 데이터 AES 암호화
      const rawPayload = JSON.stringify({
        name,
        phone,
        participation: participate,
        time_priorities: timeResult,
        affiliation,
        bank_name: bankName,
        account_number: accountNumber,
        address,
        training_date: trainingDate,
        submitted_at: new Date().toISOString()
      });

      const encryptedData = CryptoJS.AES.encrypt(rawPayload, PUBLIC_ENCRYPTION_SECRET).toString();

      try {
        const res = await fetch(API_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify({
            action: "submit",
            code: code,
            encrypted_payload: encryptedData,
            actual_name: name,
            actual_phone: phone
          })
        });

        const result = await res.json();
        if (result.success) {
          document.getElementById("survey-form").classList.add("hidden");
          document.getElementById("step-complete").classList.remove("hidden");
        } else {
          alert("제출 실패: " + result.message);
          submitBtn.disabled = false;
          submitBtn.textContent = "제출하기";
        }
      } catch (err) {
        alert("통신 오류가 발생했습니다: " + err.message);
        submitBtn.disabled = false;
        submitBtn.textContent = "제출하기";
      }
    }
  </script>
</body>
</html>
